<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutin Panosu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1117;
    font-family:'Segoe UI','DejaVu Sans',Arial,sans-serif; color:#e6edf3;
    -webkit-user-select:none; user-select:none; cursor:none; }
  #app { display:flex; width:100%; height:100%; }

  /* ---- SOL PANEL ---- */
  #left { width:38%; height:100%; padding:2.2vh 2vw; display:flex; flex-direction:column;
    background:linear-gradient(160deg,#16213e,#0d1117 70%); border-right:1px solid #21262d; }
  #clock { font-size:8.5vh; font-weight:800; line-height:1; letter-spacing:0.02em; }
  #date { font-size:2.6vh; color:#8b949e; margin-top:0.6vh; }
  #wx { font-size:2.2vh; color:#8b949e; margin-top:1vh; }
  #moonZone { margin-top:1.6vh; display:flex; align-items:center; gap:1vw; }
  #moonBig { font-size:5.5vh; line-height:1; }
  #moonTxt { font-size:2.1vh; color:#8b949e; }
  #sun { font-size:2.2vh; color:#8b949e; margin-top:0.5vh; }
  #mealInfo { font-size:2.4vh; color:#d4a017; margin-top:1.4vh; line-height:1.4; }
  #mealInfo b { color:#e8c766; }
  #nowLabel { margin-top:2.4vh; display:inline-block; }
  #nowLabel span { background:#e6edf3; color:#0d1117; font-size:2vh; font-weight:800;
    padding:0.5vh 1vw; border-radius:0.8vh; letter-spacing:0.12em; }
  #nowName { font-size:5vh; font-weight:800; line-height:1.12; margin-top:1.2vh; }
  #nowDesc { font-size:2.1vh; color:#8b949e; margin-top:0.6vh; line-height:1.35; }
  #remain { font-size:2.9vh; color:#ffa657; font-weight:700; margin-top:1vh; }
  #barWrap { margin-top:1.6vh; height:2.4vh; background:#21262d; border-radius:1.2vh; overflow:hidden; }
  #bar { height:100%; width:0%; background:linear-gradient(90deg,#238636,#2ea043); border-radius:1.2vh;
    transition:width 1s linear; }
  #nexts { margin-top:auto; padding-top:2vh; }
  .nx { font-size:2.5vh; color:#8b949e; padding:0.7vh 0; }
  .nx b { color:#e6edf3; font-weight:600; }
  #prog { font-size:2.2vh; color:#484f58; margin-top:1.2vh; }

  /* ---- ORTA: GÜNLÜK PLAN ---- */
  #right { flex:1; border-right:1px solid #21262d; height:100%; padding:1.6vh 1.4vw; overflow:hidden;
    display:flex; flex-direction:column; }
  #rTitle { font-size:2vh; font-weight:800; letter-spacing:0.14em; color:#484f58; padding:0 0 1vh 0.6vw; }
  #list { flex:1; display:flex; flex-direction:column; gap:0.45vh; }
  .blk { flex:1 1 0; min-height:0; display:grid; grid-template-columns:5.4vw 1fr auto;
    align-items:center; padding:0 1vw; border-radius:0.9vh;
    background:#161b22; border-left:0.45vw solid #30363d; }
  .blk .t { font-size:2.3vh; font-weight:800; color:#8b949e; font-variant-numeric:tabular-nums; }
  .blk .n { font-size:2.2vh; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .blk .d { font-size:1.9vh; color:#484f58; font-variant-numeric:tabular-nums; }
  .blk.meal  { border-left-color:#d4a017; }
  .blk.work  { border-left-color:#2ea043; }
  .blk.train { border-left-color:#f85149; }
  .blk.yoga { border-left-color:#a371f7; }
  .blk.sleep { border-left-color:#d0703f; }
  .blk.past { opacity:0.32; }
  .blk.now { background:#e6edf3; }
  .blk.now .t, .blk.now .n { color:#0d1117; }
  .blk.now .d { color:#57606a; }

  /* ---- SAĞ: BESLENME · TAKVİYE · SU (dokun → işaretle) ---- */
  #nutri { width:31%; height:100%; padding:1.6vh 1.2vw; display:flex; flex-direction:column; }
  #nTitle { font-size:2vh; font-weight:800; letter-spacing:0.14em; color:#484f58; padding:0 0 1vh 0.4vw;
    display:flex; justify-content:space-between; }
  #nTitle b { color:#2ea043; letter-spacing:0; }
  #nlist { flex:1; display:flex; flex-direction:column; gap:0.45vh; min-height:0; }
  .it { flex:1 1 0; min-height:0; display:grid; grid-template-columns:4.6vw 1fr 3.8vh;
    align-items:center; gap:0 0.6vw; padding:0 0.8vw; border-radius:0.9vh; width:100%; text-align:left;
    background:#161b22; border:0; border-left:0.4vw solid #30363d; color:inherit; font:inherit; cursor:none; }
  .it.Y { border-left-color:#d4a017; }
  .it.T { border-left-color:#a371f7; }
  .it .t { font-size:2.1vh; font-weight:800; color:#8b949e; font-variant-numeric:tabular-nums; }
  .it .tx { min-width:0; }
  .it .n { font-size:2.1vh; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .d { font-size:1.6vh; color:#6e7681; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .ck { width:3.2vh; height:3.2vh; border-radius:0.7vh; border:0.25vh solid #484f58;
    display:grid; place-items:center; font-size:2.1vh; font-weight:800; color:#0d1117; }
  .it.done { opacity:0.45; }
  .it.done .ck { background:#2ea043; border-color:#2ea043; }
  .it.done .n { text-decoration:line-through; }
  .it.miss .ck { border-color:#f85149; }
  .it.miss .t { color:#f85149; }
  .it.now { background:#e6edf3; opacity:1; }
  .it.now .t, .it.now .n { color:#0d1117; }
  .it.now .d { color:#57606a; }
  #waterBox { margin-top:1.2vh; }
  #waterHdr { font-size:2vh; color:#8b949e; margin-bottom:0.6vh; }
  #waterHdr b { color:#58a6ff; }
  #water { display:flex; gap:0.4vw; }
  #water .cup { flex:1; display:flex; flex-direction:column; align-items:center; gap:0.2vh;
    background:none; border:0; color:#8b949e; font:inherit; font-size:1.45vh; padding:0; cursor:none; }
  #water svg { height:4vh; width:auto; }
  #water path { fill:none; stroke:#58a6ff; stroke-width:1.2; }
  #water .cup.on path { fill:#58a6ff; }
  #water .cup.due path { stroke:#ffa657; }
  #water .cup.due { color:#ffa657; }

  /* ---- GECE MODU ---- */
  body.night #app { display:none; }
  #nightView { display:none; }
  body.night #nightView { display:flex; width:100%; height:100%;
    flex-direction:column; align-items:center; justify-content:center; background:#000; }
  #nMoon { font-size:9vh; opacity:0.5; margin-bottom:1vh; }
  #nClock { font-size:16vh; font-weight:200; color:#3d444d; letter-spacing:0.04em; }
  #nInfo { font-size:3vh; color:#21262d; margin-top:2vh; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="clock">--:--</div>
    <div id="date">—</div>
    <div id="wx">—</div>
    <div id="sun">—</div>
    <div id="nowLabel"><span>ŞİMDİ</span></div>
    <div id="nowName">—</div>
    <div id="nowDesc"></div>
    <div id="remain">—</div>
    <div id="barWrap"><div id="bar"></div></div>
    <div id="moonZone">
      <div id="moonBig">—</div>
      <div id="moonTxt">—</div>
    </div>
    <div id="mealInfo">—</div>
    <div id="nexts">
      <div class="nx" id="nx1">—</div>
      <div class="nx" id="nx2">—</div>
      <div id="prog">—</div>
    </div>
  </div>
  <div id="right">
    <div id="rTitle">GÜNLÜK PLAN</div>
    <div id="list"></div>
  </div>
  <div id="nutri">
    <div id="nTitle"><span>ÖĞÜN · TAKVİYE · SU</span><b id="nCount"></b></div>
    <div id="nlist"></div>
    <div id="waterBox">
      <div id="waterHdr">Su</div>
      <div id="water"></div>
    </div>
  </div>
</div>
<div id="nightView">
  <div id="nMoon">🌙</div>
  <div id="nClock">--:--</div>
  <div id="nInfo">—</div>
</div>

<script>
const BUILD = "20261103-2050";
// ===== PLAN =====
const SCHEDULE = [
  { s:"05:30", n:"Uyanış & Hazırlık", c:"", d:"Su iç · tartı (aç karnına) · CP ölç: normal nefes ver, ilk nefes dürtüsüne kadar say (hedef 40 sn) · ışıkları aç" },
  { s:"05:40", n:"Antrenman", c:"train", split:true },
  { s:"06:10", n:"Soğuma & Esneme", c:"train", cool:true },
  { s:"06:30", n:"Öğün 1", c:"meal" },
  { s:"06:50", n:"Duş & Hazırlık", c:"" },
  { s:"07:00", n:"Atölye 1'e Gidiş", c:"" },
  { s:"07:30", n:"İş — Atölye 1", c:"work" },
  { s:"09:30", n:"Öğün 2 · Mola", c:"meal" },
  { s:"09:50", n:"İş — Atölye 1", c:"work" },
  { s:"12:00", n:"Öğün 3", c:"meal" },
  { s:"12:30", n:"İş — Atölye 1", c:"work" },
  { s:"14:15", n:"Günü Kapat · Yarını Planla", c:"work", d:"Kağıda 3 madde: bugün biten · yarın ilk 3 iş · Sarayçık'ta sıradaki adım — sonra atölyeyi kapat" },
  { s:"14:30", n:"Eve Dönüş", c:"" },
  { s:"15:00", n:"Serbest / Dinlenme", c:"", d:"Ev · dinlenme, ekran az" },
  { s:"16:30", n:"Öğün 4", c:"meal" },
  { s:"17:00", n:"Tempolu Yürüyüş", c:"train", walk:true },
  { s:"17:20", n:"Soğuk Duş / Buteyko Nefes", c:"", d:"2-3 dk soğuk su · ardından Buteyko 4-9-10 ×10 tur, oturarak, burundan (4 sn al · 9 sn ver · boş akciğerle 10 sn tut) — hafif hava açlığı hedef, baş dönmesi olursa dur" },
  { s:"17:35", n:"Kitap Okuma", c:"yoga", d:"45 dk kitap · ekran yok" },
  { s:"18:20", n:"Serbest / Tampon", c:"", d:"Ev · serbest — iş yok, ekran az, yemek yok" },
  { s:"20:00", n:"Trataka Meditasyonu · Yatış", c:"", d:"Önce 4-7-8 ×4 (4 al · 7 tut · 8 ver) · sonra loş oda, mum göz hizasında ~1 m · 10 dk gözler açık aleve bak · 2-3 dk gözler kapalı · yat" },
  { s:"20:15", n:"UYKU", c:"sleep", d:"Karartma perdesi · 9 sa 15 dk" },
];
const WATER_TIMES = ["05:30","06:00","06:30","08:30","09:30","12:00","14:30","17:00"];  // 8 × 0,5 L
const PROGRAM = {
  1: { n:"İtiş · Göğüs/Omuz/Arka kol", d:"Isınma: arm + shoulder circles 3 tur · Incline bench 4×6-8 · Incline DB press 3×8-10 · DB fly 3×10-12 · Bench dips 3×10 · Lateral raise 4×12-15 · DB triceps ext 3×10 · Overhead DB ext 3×10 · Soğuma: göğüs esneme" },
  2: { n:"Çekiş · Sırt/Ön kol", d:"Isınma: pelvik tilt + cat cow · Pull up 3×8 · Barbell row 4×6-8 · DB row 3×10-12 (tek) · DB pullover 3×10-12 · Shrug 4×10-12 · EZ curl 4×8-10 · Hammer curl 4×10-12 · Soğuma: hamstring + omuz esneme" },
  3: { n:"HIIT · Tüm vücut süperset", d:"Isınma: jumping jack + high knees · SS DB squat press + goblet squat 3×10-15 · SS RDL + barbell row 3×10 · SS push up + renegade row 3×10-15 · SS alt. curl + DB shoulder press 3×10-15 · SS leg raise + crunch 3×10-15 · Soğuma: quad + hamstring" },
  4: { n:"Üst Bölge", d:"Isınma: arm + shoulder circles · Incline bench 4×8 · Barbell row 3×10 · DB shoulder press 3×10-12 · SS lateral + front raise 3×12 · EZ lying triceps 3×10 · EZ curl 3×10 · Push up 2×max · Soğuma: göğüs esneme + cat cow" },
  5: { n:"Bacak", d:"Isınma: lunge stretch + knee to chest · Barbell squat 4×6-8 · RDL 4×8-10 · Lunge 3×12 (tek, DB) · Bulgarian split squat 3×10 · Calf raise 4×12-15 · Wall sit 2×45 sn (tükeniş) · Soğuma: quad + hamstring" },
  6: { n:"Kardiyo · 45 dk Tempolu Yürüyüş", d:"45 dk brisk walking, nabız 110-130 · koşu bandı / bisiklet / dışarıda yürüyüş" },
  0: { n:"Kardiyo Günü · 45 dk Yürüyüş", d:"45 dk brisk walking, nabız 110-130 · rahat tempo" },
};
// [saat, tür (T=takviye, Y=yemek), başlık, içerik(null=öğün içeriği)]
const ITEMS = [
  ["05:30","T","Psyllium","1 servis + büyük bardak su · aç karnına, diğer takviyelerden ayrı"],
  ["05:35","T","L-Karnitin","1 servis · antrenmandan önce"],
  ["05:40","T","EAA + elektrolit","EAA 10 g + izotonik elektrolit 1 ölçek · antrenman boyunca"],
  ["06:00","T","Berberine + krom","Berberine 500 mg + krom pikolinat · Öğün 1'den 30 dk önce"],
  ["06:30","Y","Öğün 1",null],
  ["06:50","T","Öğün 1 sonrası","D3K2 4000 IU · Kreatin 5 g · Prebiyotik"],
  ["09:30","Y","Öğün 2",null],
  ["09:50","T","Omega-3","Omega-3 1000 mg · Öğün 2 sonrası"],
  ["11:30","T","Berberine + krom","Berberine 500 mg + krom pikolinat · Öğün 3'ten 30 dk önce"],
  ["12:00","Y","Öğün 3",null],
  ["16:30","Y","Öğün 4",null],
  ["20:00","T","Magnezyum + çinko","Magnezyum 250 mg · Çinko bisglisinat 40 mg · yatmadan önce"],
];
const PRE = 10, POST = { T:20, Y:30 };
const ZONE2_DAYS = [3, 6];   // Çar, Cmt → 60 dk Zone 2
const REST_DAYS = [0];        // Paz → tam dinlenme   // JS getDay(): Paz=0, Per=4
const DAY_START = 330;   // gün 05:30
const DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const norm = m => (m - DAY_START + 1440) % 1440;
const starts = SCHEDULE.map(b => norm(toMin(b.s)));

function blkName(i, wd){
  let n = SCHEDULE[i].n;
  if (SCHEDULE[i].split) n = "Antrenman · " + PROGRAM[wd].n;
  if (SCHEDULE[i].walk) n = (wd === 0 || wd === 6) ? "Hafif Yürüyüş" : "Tempolu Yürüyüş · 20 dk";
  if (SCHEDULE[i].cool) n = (wd === 0 || wd === 6) ? "Kardiyo · devam" : "Soğuma & Esneme";
  return n;
}
function blkDesc(i, wd){
  let d = "";
  if (SCHEDULE[i].split) d = PROGRAM[wd].d;
  else if (SCHEDULE[i].walk) d = (wd === 0 || wd === 6) ? "Hafta sonu: sabah kardiyo yapıldı · 10-15 dk hafif sindirim yürüyüşü" : "Antrenörün 20 dk yürüyüşü · nabız 110-130 · son öğünden sonra sindirime de iyi · günlük hedef 10.000 adım";
  else if (SCHEDULE[i].cool) d = (wd === 0 || wd === 6) ? "Hafta sonu: kardiyonun devamı · toplam 45-50 dk, nabız 110-130" : "Antrenmanın soğuma bölümü · esneme, nefes · su iç";
  else if (SCHEDULE[i].c === "meal") d = (mealContent(SCHEDULE[i].n, wd) || "") + " · 2 g tuz";
  else d = SCHEDULE[i].d || "";
  const a = starts[i], b = i+1 < starts.length ? starts[i+1] : 1440;
  const sp = ITEMS.filter(x => x[1]==="T" && norm(toMin(x[0]))>=a && norm(toMin(x[0]))<b).map(x => x[0]+" "+x[2]);
  return sp.length ? d + "  💊 " + sp.join(" · ") : d;
}

function getState(now){
  const cur = norm(now.getHours()*60 + now.getMinutes());
  const n = SCHEDULE.length;
  let idx = n-1;
  for (let i=0;i<n;i++){
    const end = i+1<n ? starts[i+1] : 1440;
    if (starts[i]<=cur && cur<end){ idx=i; break; }
  }
  const end = idx+1<n ? starts[idx+1] : 1440;
  const wait = end - cur;
  const dur = end - starts[idx];
  const pct = dur>0 ? Math.min(100, Math.max(0,(cur-starts[idx])/dur*100)) : 0;
  return { idx, wait, pct,
    nxt1:(idx+1)%n, nxt2:(idx+2)%n,
    sleeping: SCHEDULE[idx].n==="UYKU" };
}

function fmtWait(m){
  const h=Math.floor(m/60), mm=m%60;
  return h ? `Kalan: ${h} sa ${mm} dk` : `Kalan: ${mm} dk`;
}

let listBuilt = false;
function buildList(){
  const el = document.getElementById("list");
  el.innerHTML = SCHEDULE.map((b,i)=>
    `<div class="blk ${b.c}" id="b${i}">
       <span class="t">${b.s}</span><span class="n">${b.n}</span>
       <span class="d"></span>
     </div>`).join("");
  listBuilt = true;
}

function render(){
  const now = new Date();
  const wd = now.getDay();
  const st = getState(now);
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");

  // Gece modu (uyku bloğu)
  document.body.classList.toggle("night", st.sleeping);
  if (st.sleeping){
    document.getElementById("nClock").textContent = `${hh}:${mm}`;
    const h=Math.floor(st.wait/60), m2=st.wait%60;
    document.getElementById("nInfo").textContent = `Uyanış 05:30 · ${h} sa ${m2} dk`;
    return;
  }

  if (!listBuilt) buildList();
  document.getElementById("clock").textContent = `${hh}:${mm}`;
  document.getElementById("date").textContent =
    `${now.getDate()} ${MONTHS[now.getMonth()]} ${DAYS[wd]}`;
  document.getElementById("nowName").textContent = blkName(st.idx, wd);
  document.getElementById("remain").textContent = fmtWait(st.wait);
  document.getElementById("nowDesc").textContent = blkDesc(st.idx, wd);
  document.getElementById("bar").style.width = st.pct.toFixed(1)+"%";
  document.getElementById("nx1").innerHTML =
    `→ <b>${SCHEDULE[st.nxt1].s}</b> · ${blkName(st.nxt1, wd)}`;
  document.getElementById("nx2").innerHTML =
    `→ <b>${SCHEDULE[st.nxt2].s}</b> · ${blkName(st.nxt2, wd)}`;
  document.getElementById("prog").textContent = `Bugün: ${st.idx}/${SCHEDULE.length} tamamlandı`;
  renderNutri(now);

  SCHEDULE.forEach((b,i)=>{
    const el = document.getElementById("b"+i);
    el.querySelector(".n").textContent = blkName(i, wd);
    el.classList.toggle("now", i===st.idx);
    el.classList.toggle("past", i<st.idx);
  });
}

// ===== Öğün içerikleri (mutfak talimatına göre · gün rotasyonlu) =====
// Diyetisyen planı · Off gün (Cmt, Paz) karbonhidrat yarıya iner · her öğünde 2 g tuz
const OFF_DAYS = [6, 0];
function mealContent(name, wd){
  const off = OFF_DAYS.includes(wd);
  if (name.startsWith("Öğün 1")) return `30 g isolate whey + 1 yumurta + ${off?40:80} g yulaf + 60 g çilek · 520 kcal`;
  if (name.startsWith("Öğün 2")) return `150 g tavuk/hindi göğüs + ${off?40:80} g basmati + 5 g zeytinyağı + salata · 503 kcal`;
  if (name.startsWith("Öğün 3")) return `150 g tavuk göğüs / yağsız kıyma + ${off?40:80} g basmati + 5 g zeytinyağı · 525 kcal`;
  if (name.startsWith("Öğün 4")) return `150 g mezgit/tavuk + ${off?120:250} g patates + 5 g zeytinyağı + 100 g sebze · 435 kcal`;
  return null;
}

// ===== Öğün · takviye · su takibi (dokun → işaretle; bu cihazda saklanır, her sabah sıfırlanır) =====
const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2,"0");
function dayKey(now){
  const d = new Date(now.getTime() - (DAY_START-15)*60000);
  return `pano:${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
let mKey = null, marks = {}, nBuilt = false;
function loadMarks(now){
  const k = dayKey(now); if (k === mKey) return;
  mKey = k; nBuilt = false;
  try { marks = JSON.parse(localStorage.getItem(k) || "{}"); } catch(e){ marks = {}; }
}
function saveMarks(){ try { localStorage.setItem(mKey, JSON.stringify(marks)); } catch(e){} }
function toggle(id){ marks[id] = !marks[id]; saveMarks(); renderNutri(new Date()); }
function nutriItems(wd){
  return ITEMS.map(([t,k,n,d],i)=>({ id:"i"+i, t, k, n, m:norm(toMin(t)), d: d ?? (mealContent(n, wd) || "") }));
}
function renderNutri(now){
  loadMarks(now);
  const cur = norm(now.getHours()*60 + now.getMinutes());
  const items = nutriItems(now.getDay());
  if (!nBuilt){
    $("nlist").innerHTML = items.map(it =>
      `<button class="it ${it.k}" id="${it.id}" type="button"><span class="t">${it.t}</span>
        <span class="tx"><div class="n">${it.n}</div><div class="d"></div></span><span class="ck"></span></button>`).join("");
    items.forEach(it => $(it.id).addEventListener("click", () => toggle(it.id)));
    $("water").innerHTML = WATER_TIMES.map((t,i) =>
      `<button class="cup" id="w${i}" type="button"><svg viewBox="0 0 10 12"><path d="M1 0.5h8l-1.2 11H2.2z"/></svg>${t}</button>`).join("");
    WATER_TIMES.forEach((t,i) => $("w"+i).addEventListener("click", () => toggle("w"+i)));
    nBuilt = true;
  }
  const live = items.filter(it => it.m - PRE <= cur && cur <= it.m + POST[it.k]);
  items.forEach(it => {
    const el = $(it.id), done = !!marks[it.id];
    el.querySelector(".d").textContent = it.d;
    el.classList.toggle("done", done);
    el.classList.toggle("now", !done && live.includes(it));
    el.classList.toggle("miss", !done && cur > it.m + POST[it.k]);
    el.querySelector(".ck").textContent = done ? "✓" : "";
  });
  let cups = 0, behind = 0, nextT = null;
  WATER_TIMES.forEach((t,i) => {
    const on = !!marks["w"+i], tn = norm(toMin(t));
    if (on) cups++; else { if (cur >= tn) behind++; if (!nextT) nextT = t; }
    const el = $("w"+i);
    el.classList.toggle("on", on);
    el.classList.toggle("due", !on && cur >= tn - 10);
  });
  $("waterHdr").innerHTML = `Su <b>${(cups*0.5).toFixed(1).replace(".",",")} / 4 L</b>` +
    (behind ? ` · ${behind} bardak geride` : (nextT ? ` · sıradaki ${nextT}` : " · tamam"));
  $("nCount").textContent = `${items.filter(it => marks[it.id]).length}/${items.length}`;
  // soldaki bilgi satırı: şimdi alınacak takviye / öğün, yoksa sıradaki
  const el = $("mealInfo");
  const nowIt = live.filter(it => !marks[it.id]).slice(-1)[0];
  const nxt = items.find(it => it.m > cur && !marks[it.id]);
  const show = nowIt || nxt;
  if (show){
    const ic = show.k === "Y" ? "🍽" : "💊";
    el.innerHTML = `${ic} <b>${nowIt ? "Şimdi" : show.t}</b> ${show.n}: ${show.d}`;
  } else el.textContent = "";
}

// ===== Ay evresi (offline hesap) =====
const SYNODIC = 29.53058867;
const NEW_MOON_REF = Date.UTC(2000, 0, 6, 18, 14);   // bilinen yeni ay
function moonPhase(now){
  const age = ((now.getTime() - NEW_MOON_REF) / 86400000) % SYNODIC;
  const illum = Math.round((1 - Math.cos(2*Math.PI*age/SYNODIC)) / 2 * 100);
  const idx = Math.floor((age / SYNODIC) * 8 + 0.5) % 8;
  const EMO   = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  const NAMES = ["Yeni Ay","Hilal","İlk Dördün","Şişkin Ay",
                 "Dolunay","Şişkin Ay","Son Dördün","Balsamik Ay"];
  return { emo: EMO[idx], name: NAMES[idx], illum };
}
function updateMoon(){
  const m = moonPhase(new Date());
  document.getElementById("moonBig").textContent = m.emo;
  document.getElementById("moonTxt").textContent = `${m.name} · %${m.illum}`;
  document.getElementById("nMoon").textContent = m.emo;
}

// ===== Hava (Open-Meteo · Alanya) =====
function updateWx(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=36.54&longitude=31.99&current=temperature_2m,relative_humidity_2m,apparent_temperature&daily=sunrise,sunset&forecast_days=1&timezone=Europe%2FIstanbul")
    .then(r=>r.json())
    .then(d=>{
      const c=d.current;
      document.getElementById("wx").textContent =
        `Alanya ${Math.round(c.temperature_2m)}°C · hissedilen ${Math.round(c.apparent_temperature)}° · nem %${c.relative_humidity_2m}`;
      if (d.daily && d.daily.sunrise){
        const sr = d.daily.sunrise[0].slice(11,16);
        const ss = d.daily.sunset[0].slice(11,16);
        document.getElementById("sun").textContent = `🌅 ${sr} doğuş · 🌇 ${ss} batış`;
      }
    }).catch(()=>{});
}

// ===== PWA: service worker + ekranı uyanık tut =====
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
let wakeLock = null;
async function keepAwake(){
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
document.addEventListener("click", keepAwake, { once:true });
keepAwake();

render();
updateWx();
updateMoon();
setInterval(render, 1000);
setInterval(updateWx, 30*60*1000);
setInterval(updateMoon, 60*60*1000);

// ===== Otomatik güncelleme: sunucudaki sürüm değiştiyse sayfayı yenile =====
function checkUpdate(){
  fetch(location.pathname.endsWith("/") ? "index.html" : location.pathname.split("/").pop(), {cache:"no-store"})
    .then(r => r.text())
    .then(t => { if (t.includes("const BUILD") && !t.includes(`const BUILD = "${BUILD}"`)) location.reload(); })
    .catch(()=>{});
}
setInterval(checkUpdate, 30*60*1000);
