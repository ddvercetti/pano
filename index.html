<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beslenme Panosu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1117;
    font-family:'Segoe UI','DejaVu Sans',Arial,sans-serif; color:#e6edf3;
    -webkit-user-select:none; user-select:none; cursor:none; -webkit-tap-highlight-color:transparent; }
  #app { display:flex; width:100%; height:100%; }

  /* ---- SOL PANEL ---- */
  #left { width:52%; height:100%; padding:2.2vh 2vw; display:flex; flex-direction:column;
    background:linear-gradient(160deg,#16213e,#0d1117 70%); border-right:1px solid #21262d; }
  #clock { font-size:9.5vh; font-weight:800; line-height:1; letter-spacing:0.02em; }
  #date { font-size:2.6vh; color:#8b949e; margin-top:0.6vh; }
  #wx, #sun { font-size:2.2vh; color:#8b949e; margin-top:0.6vh; }
  #nowLabel { margin-top:3vh; display:flex; align-items:center; gap:1vw; }
  #nowLabel span { background:#e6edf3; color:#0d1117; font-size:2vh; font-weight:800;
    padding:0.5vh 1vw; border-radius:0.8vh; letter-spacing:0.12em; }
  #nowLabel.supp span { background:#a371f7; color:#0d1117; }
  #nowLabel.meal span { background:#d4a017; }
  #nowLabel em { font-style:normal; font-size:2.6vh; color:#ffa657; font-weight:700; }
  #nowName { font-size:6.2vh; font-weight:800; line-height:1.12; margin-top:1.2vh; }
  #nowDesc { font-size:2.5vh; color:#c9d1d9; margin-top:0.8vh; line-height:1.4; }
  #nowBtn { margin-top:1.6vh; align-self:flex-start; font:inherit; font-size:2.4vh; font-weight:700;
    background:#238636; color:#fff; border:0; border-radius:1vh; padding:1.1vh 2vw; }
  #nowBtn.on { background:#21262d; color:#8b949e; }
  #moonZone { margin-top:2.4vh; display:flex; align-items:center; gap:1.2vw; }
  #moonBig { font-size:6vh; line-height:1; }
  #moonTxt { font-size:2.2vh; color:#8b949e; }
  #waterBox { margin-top:auto; }
  #waterHdr { font-size:2.2vh; color:#8b949e; margin-bottom:0.8vh; }
  #waterHdr b { color:#58a6ff; }
  #water { display:flex; gap:0.7vw; }
  #water .cup { flex:1; height:6.5vh; display:flex; flex-direction:column; align-items:center; gap:0.3vh;
    background:none; border:0; color:#8b949e; font:inherit; font-size:1.6vh; padding:0; }
  #water svg { height:4.6vh; width:auto; }
  #water path { fill:none; stroke:#58a6ff; stroke-width:1.2; }
  #water .cup.on path { fill:#58a6ff; }
  #water .cup.due path { stroke:#ffa657; }
  #water .cup.due { color:#ffa657; }
  #prog { font-size:2.2vh; color:#484f58; margin-top:1.4vh; }
  #barWrap { margin-top:0.8vh; height:1.6vh; background:#21262d; border-radius:0.8vh; overflow:hidden; }
  #bar { height:100%; width:0%; background:linear-gradient(90deg,#238636,#2ea043); transition:width .6s; }

  /* ---- SAĞ LİSTE ---- */
  #right { flex:1; height:100%; padding:1.6vh 1.4vw; overflow:hidden; display:flex; flex-direction:column; }
  #rTitle { font-size:2vh; font-weight:800; letter-spacing:0.14em; color:#484f58; padding:0 0 1vh 0.6vw; }
  #list { flex:1; display:flex; flex-direction:column; gap:0.5vh; }
  .it { flex:1 1 0; min-height:0; display:grid; grid-template-columns:6.2vw 1fr 4.6vh;
    align-items:center; gap:0 0.8vw; padding:0 1vw; border-radius:0.9vh; width:100%; text-align:left;
    background:#161b22; border:0; border-left:0.45vw solid #30363d; color:inherit; font:inherit; }
  .it.Y { border-left-color:#d4a017; }
  .it.T { border-left-color:#a371f7; }
  .it .t { font-size:2.3vh; font-weight:800; color:#8b949e; font-variant-numeric:tabular-nums; }
  .it .tx { min-width:0; }
  .it .n { font-size:2.3vh; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .d { font-size:1.75vh; color:#6e7681; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .ck { width:3.6vh; height:3.6vh; border-radius:0.8vh; border:0.25vh solid #484f58;
    display:grid; place-items:center; font-size:2.4vh; font-weight:800; color:#0d1117; }
  .it.done { opacity:0.45; }
  .it.done .ck { background:#2ea043; border-color:#2ea043; }
  .it.done .n { text-decoration:line-through; }
  .it.miss .ck { border-color:#f85149; }
  .it.miss .t { color:#f85149; }
  .it.now { background:#e6edf3; opacity:1; }
  .it.now .t, .it.now .n { color:#0d1117; }
  .it.now .d { color:#57606a; }

  /* ---- GECE MODU ---- */
  body.night #app { display:none; }
  #nightView { display:none; }
  body.night #nightView { display:flex; width:100%; height:100%;
    flex-direction:column; align-items:center; justify-content:center; background:#000; }
  #nMoon { font-size:9vh; opacity:0.5; margin-bottom:1vh; }
  #nClock { font-size:16vh; font-weight:200; color:#3d444d; letter-spacing:0.04em; }
  #nInfo { font-size:3vh; color:#30363d; margin-top:2vh; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="clock">--:--</div>
    <div id="date">—</div>
    <div id="wx">—</div>
    <div id="sun"></div>
    <div id="nowLabel"><span>ŞİMDİ</span><em></em></div>
    <div id="nowName">—</div>
    <div id="nowDesc"></div>
    <button id="nowBtn" type="button">✓ Aldım</button>
    <div id="moonZone"><div id="moonBig">—</div><div id="moonTxt">—</div></div>
    <div id="waterBox">
      <div id="waterHdr">Su</div>
      <div id="water"></div>
      <div id="prog">—</div>
      <div id="barWrap"><div id="bar"></div></div>
    </div>
  </div>
  <div id="right">
    <div id="rTitle">BESLENME · TAKVİYE · SU</div>
    <div id="list"></div>
  </div>
</div>
<div id="nightView">
  <div id="nMoon">🌙</div>
  <div id="nClock">--:--</div>
  <div id="nInfo">—</div>
</div>

<script>
const BUILD = "20261101-2010";
// ===== BESLENME PLANI (diyetisyen) — e-ink ile aynı =====
const DAY_START = 315;   // gün 05:15 (uyanış 05:30)
const WAKE = "05:30", SLEEP = "20:15";
const OFF_DAYS = [6, 0]; // Cmt, Paz → karbonhidrat yarı
const WATER_TIMES = ["05:30","06:15","07:15","09:15","10:15","12:45","14:45","17:30"];  // 8 × 0,5 L
// [saat, tür (T=takviye, Y=yemek), başlık, içerik(null=öğün içeriği)]
const ITEMS = [
  ["05:30","T","Psyllium","1 servis + büyük bardak su · aç karnına, diğer takviyelerden ayrı"],
  ["06:00","T","L-Karnitin","1 servis · antrenmandan önce"],
  ["06:15","T","EAA + elektrolit","EAA 10 g + izotonik elektrolit 1 ölçek · antrenman boyunca"],
  ["06:45","T","Berberine + krom","Berberine 500 mg + krom pikolinat · Öğün 1'den 30 dk önce"],
  ["07:15","Y","Öğün 1",null],
  ["07:35","T","Sabah takviyeleri","Kreatin 5 g · D3K2 4000 IU · Omega-3 1000 mg · Prebiyotik"],
  ["10:15","Y","Öğün 2",null],
  ["12:15","T","Berberine + krom","Berberine 500 mg + krom pikolinat · Öğün 3'ten 30 dk önce"],
  ["12:45","Y","Öğün 3",null],
  ["16:45","Y","Öğün 4",null],
  ["20:00","T","Magnezyum + çinko","Magnezyum 250 mg · Çinko bisglisinat 40 mg · yatmadan önce"],
];
const PRE = 10, POST = { T:20, Y:30 };   // ŞİMDİ penceresi (dk)
function mealContent(name, wd){
  const off = OFF_DAYS.includes(wd);
  if (name === "Öğün 1") return `30 g isolate whey + 1 yumurta + ${off?40:80} g yulaf + 60 g çilek · 520 kcal`;
  if (name === "Öğün 2") return `150 g tavuk/hindi göğüs + ${off?40:80} g basmati + 5 g zeytinyağı + salata · 503 kcal`;
  if (name === "Öğün 3") return `150 g tavuk göğüs / yağsız kıyma + ${off?40:80} g basmati + 5 g zeytinyağı · 525 kcal`;
  if (name === "Öğün 4") return `150 g mezgit/tavuk + ${off?120:250} g patates + 5 g zeytinyağı + 100 g sebze · 435 kcal`;
  return "";
}
const DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const toMin = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
const norm = m => (m - DAY_START + 1440) % 1440;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");

// ===== İşaretler: bu cihazda, güne göre (gün 05:15'te başlar) =====
function dayKey(now){
  const d = new Date(now.getTime() - DAY_START*60000);
  return `pano:${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
let key = null, marks = {};
function loadMarks(now){
  const k = dayKey(now);
  if (k === key) return;
  key = k;
  try { marks = JSON.parse(localStorage.getItem(k) || "{}"); } catch(e){ marks = {}; }
}
function saveMarks(){ try { localStorage.setItem(key, JSON.stringify(marks)); } catch(e){} }
function toggle(id){ marks[id] = !marks[id]; saveMarks(); render(); }

function getState(now){
  const cur = norm(now.getHours()*60 + now.getMinutes());
  const wd = now.getDay();
  const items = ITEMS.map(([t,k,n,d],i)=>({ i, id:"i"+i, t, k, n, m:norm(toMin(t)),
    d: d ?? mealContent(n, wd) }));
  const live = items.filter(it => it.m - PRE <= cur && cur <= it.m + POST[it.k]);
  const liveMeals = live.filter(it => it.k === "Y");
  const active = (liveMeals.length ? liveMeals : live).slice(-1)[0] || null;
  // odak: aktif madde, yoksa işaretlenmemiş ilk gelecek madde
  const focus = active || items.find(it => it.m > cur) || null;
  const sleeping = cur >= norm(toMin(SLEEP));   // 20:15 → 05:15 gece
  return { cur, wd, items, active, focus, sleeping };
}

function buildList(st){
  $("list").innerHTML = st.items.map(it =>
    `<button class="it ${it.k}" id="${it.id}" type="button">
       <span class="t">${it.t}</span>
       <span class="tx"><div class="n">${it.n}</div><div class="d"></div></span>
       <span class="ck"></span>
     </button>`).join("");
  st.items.forEach(it => $(it.id).addEventListener("click", () => toggle(it.id)));
  $("nowBtn").addEventListener("click", () => { const f = $("nowBtn").dataset.id; if (f) toggle(f); });
}

let built = false;
function render(){
  const now = new Date();
  loadMarks(now);
  const st = getState(now);
  const hh = pad(now.getHours()), mm = pad(now.getMinutes());
  const nDone = st.items.filter(it => marks[it.id]).length;
  const cups = WATER_TIMES.filter((_,i) => marks["w"+i]).length;

  document.body.classList.toggle("night", st.sleeping);
  if (st.sleeping){
    $("nClock").textContent = `${hh}:${mm}`;
    $("nInfo").innerHTML = `Bugün ${nDone}/${st.items.length} · su ${(cups*0.5).toFixed(1).replace(".",",")} L<br>Uyanış ${WAKE} · Psyllium`;
    return;
  }
  if (!built){ buildList(st); built = true; }

  $("clock").textContent = `${hh}:${mm}`;
  $("date").textContent = `${now.getDate()} ${MONTHS[now.getMonth()]} ${DAYS[st.wd]}` +
    (OFF_DAYS.includes(st.wd) ? " · Off gün" : "");

  // ---- Sol: şimdi / sıradaki ----
  const f = st.focus;
  if (f){
    const lab = $("nowLabel");
    lab.className = f.k === "Y" ? "meal" : "supp";
    const tag = f.k === "Y" ? "ÖĞÜN" : "TAKVİYE";
    if (st.active){
      lab.querySelector("span").textContent = "ŞİMDİ · " + tag;
      lab.querySelector("em").textContent = f.t;
    } else {
      const w = f.m - st.cur, h = Math.floor(w/60), m = w%60;
      lab.querySelector("span").textContent = "SIRADAKİ · " + tag;
      lab.querySelector("em").textContent = `${f.t} · ${h ? h+" sa " : ""}${m} dk sonra`;
    }
    $("nowName").textContent = f.n;
    $("nowDesc").textContent = f.d;
    const b = $("nowBtn");
    b.dataset.id = f.id;
    b.classList.toggle("on", !!marks[f.id]);
    b.textContent = marks[f.id] ? "✓ İşaretlendi · geri al" : (f.k === "Y" ? "✓ Yedim" : "✓ Aldım");
  }

  // ---- Sağ liste ----
  st.items.forEach(it => {
    const el = $(it.id);
    el.querySelector(".d").textContent = it.d;
    const done = !!marks[it.id];
    el.classList.toggle("done", done);
    el.classList.toggle("now", !done && st.active === it);
    el.classList.toggle("miss", !done && st.cur > it.m + POST[it.k]);
    el.querySelector(".ck").textContent = done ? "✓" : "";
  });

  // ---- Su: dokun → bardak dolar ----
  const nextDue = WATER_TIMES.findIndex((t,i) => !marks["w"+i]);
  $("water").innerHTML = WATER_TIMES.map((t,i) => {
    const on = !!marks["w"+i];
    const due = !on && st.cur >= norm(toMin(t)) - 10;
    return `<button class="cup ${on?"on":""} ${due?"due":""}" data-i="${i}" type="button">
      <svg viewBox="0 0 10 12"><path d="M1 0.5h8l-1.2 11H2.2z"/></svg>${t}</button>`;
  }).join("");
  $("water").querySelectorAll(".cup").forEach(c => c.addEventListener("click", () => toggle("w"+c.dataset.i)));
  const behind = WATER_TIMES.filter((t,i) => !marks["w"+i] && st.cur >= norm(toMin(t))).length;
  $("waterHdr").innerHTML = `Su <b>${(cups*0.5).toFixed(1).replace(".",",")} / 4 L</b>` +
    (behind ? ` · ${behind} bardak geride` : (nextDue >= 0 ? ` · sıradaki ${WATER_TIMES[nextDue]}` : " · tamam"));

  const total = st.items.length + WATER_TIMES.length, got = nDone + cups;
  $("prog").textContent = `Bugün: ${nDone}/${st.items.length} öğün+takviye · ${cups}/8 bardak`;
  $("bar").style.width = (got/total*100).toFixed(1) + "%";
}

// ===== Ay evresi (offline hesap) =====
const SYNODIC = 29.53058867;
const NEW_MOON_REF = Date.UTC(2000, 0, 6, 18, 14);   // bilinen yeni ay
function moonPhase(now){
  const age = ((now.getTime() - NEW_MOON_REF) / 86400000) % SYNODIC;
  const illum = Math.round((1 - Math.cos(2*Math.PI*age/SYNODIC)) / 2 * 100);
  const idx = Math.floor((age / SYNODIC) * 8 + 0.5) % 8;
  const EMO   = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  const NAMES = ["Yeni Ay","Hilal","İlk Dördün","Şişkin Ay",
                 "Dolunay","Şişkin Ay","Son Dördün","Balsamik Ay"];
  return { emo: EMO[idx], name: NAMES[idx], illum };
}
function updateMoon(){
  const m = moonPhase(new Date());
  document.getElementById("moonBig").textContent = m.emo;
  document.getElementById("moonTxt").textContent = `${m.name} · %${m.illum}`;
  document.getElementById("nMoon").textContent = m.emo;
}

// ===== Hava (Open-Meteo · Alanya) =====
function updateWx(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=36.54&longitude=31.99&current=temperature_2m,relative_humidity_2m,apparent_temperature&daily=sunrise,sunset&forecast_days=1&timezone=Europe%2FIstanbul")
    .then(r=>r.json())
    .then(d=>{
      const c=d.current;
      document.getElementById("wx").textContent =
        `Alanya ${Math.round(c.temperature_2m)}°C · hissedilen ${Math.round(c.apparent_temperature)}° · nem %${c.relative_humidity_2m}`;
      if (d.daily && d.daily.sunrise){
        const sr = d.daily.sunrise[0].slice(11,16);
        const ss = d.daily.sunset[0].slice(11,16);
        document.getElementById("sun").textContent = `🌅 ${sr} · 🌇 ${ss}`;
      }
    }).catch(()=>{});
}

// ===== PWA: service worker + ekranı uyanık tut =====
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
let wakeLock = null;
async function keepAwake(){
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
document.addEventListener("click", keepAwake, { once:true });
keepAwake();

render();
updateWx();
updateMoon();
setInterval(render, 15000);
setInterval(updateWx, 30*60*1000);
setInterval(updateMoon, 60*60*1000);

// ===== Otomatik güncelleme: sunucudaki sürüm değiştiyse sayfayı yenile =====
function checkUpdate(){
  fetch(location.pathname.endsWith("/") ? "index.html" : location.pathname.split("/").pop(), {cache:"no-store"})
    .then(r => r.text())
    .then(t => { if (t.includes("const BUILD") && !t.includes(`const BUILD = "${BUILD}"`)) location.reload(); })
    .catch(()=>{});
}
setInterval(checkUpdate, 30*60*1000);
</script>
</body>
</html>
